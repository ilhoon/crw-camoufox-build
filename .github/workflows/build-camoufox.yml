name: build-crw-camoufox

on:
  schedule:
    - cron: "0 18 * * *"        # 매일 03:00 KST (UTC 18:00)
  workflow_dispatch:
    inputs:
      ref:
        description: "fastcrw/crw git tag"
        default: ""
        required: false
      platforms:
        description: "linux/amd64, linux/arm64"
        default: "linux/amd64"
        required: true
      features:
        description: "crw-server cargo features"
        default: "cdp,impersonated,camoufox"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # ref 입력이 비어 있으면(스케줄 실행 포함) 업스트림 최신 릴리스 태그를 사용
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          ref="${INPUT_REF:-$(gh api repos/fastcrw/crw/releases/latest --jq .tag_name)}"
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 스케줄 실행에서는 이미 빌드한 릴리스면 건너뜀 (수동 실행은 항상 빌드)
      - id: check
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/crw:camoufox-${{ steps.ref.outputs.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already exists; skipping build"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          repository: fastcrw/crw
          ref: ${{ steps.ref.outputs.ref }}

      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip != 'true'
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          build-args: |
            CARGO_PKGS=-p crw-server --features ${{ inputs.features || 'cdp,impersonated,camoufox' }} -p crw-mcp -p crw-cli
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/crw:camoufox
            ghcr.io/${{ steps.owner.outputs.name }}/crw:camoufox-${{ steps.ref.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
